
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Desativado | LRM Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

.logo {
    display: block;
    width: 100%;
    max-width: 750px;
    height: auto;
    margin: 0 auto 45px;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.12));
}

.linha {
    width: 55px;
    height: 2px;
    background: #777;
    margin: 0 auto 35px;
}

h1 {
    font-size: clamp(23px, 4vw, 34px);
    font-weight: 500;
    margin-bottom: 20px;
}

p {
    color: #999;
    font-size: 15px;
    line-height: 1.8;
}

.status {
    color: #666;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 10px;
    margin-bottom: 18px;
}

footer {
    margin-top: 60px;
    font-size: 11px;
    color: #444;
}

@media (max-width: 600px) {
    .logo {
        max-width: 100%;
        margin-bottom: 35px;
    }

    footer {
        margin-top: 45px;
    }
}
</style>
</head>

<body>

<main class="container">

    <img src="logo.png" alt="LRM Studio" class="logo">

    <div class="linha"></div>

    <div class="status">Aviso importante</div>

    <h1>Site temporariamente desativado</h1>

    <p>
        Este site está temporariamente indisponível.<br>
        Agradecemos pela compreensão.
    </p>

    <footer>
        &copy; <span id="ano"></span> LRM Studio
        — Todos os direitos reservados.
    </footer>

</main>

<script>
document.getElementById("ano").textContent =
    new Date().getFullYear();
</script>

</body>
</html>
